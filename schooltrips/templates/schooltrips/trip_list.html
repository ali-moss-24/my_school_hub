<!DOCTYPE html>
<html>
    <head>
        <title>School Trips</title>
    </head>
    <body>

    <h1>Avaiable School Trips</h1>

    {% for trip in trips %}

        <div>
             <h2>{{ trip.name }}</h2>
             <p>Date: {{ trip.date }}</p>
            <p>Price: £{{ trip.price }}</p>

            <a href="/trips/book/">
                Book This Trip
            </a>
        </div>
        <hr>
    {% empty %}
        <p>No trips available.</p>
    {% endfor %}

    </body>
</html>
